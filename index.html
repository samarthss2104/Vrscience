<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Pendulum Lab - Quest 3</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.misc.min.js"></script>

    <script>
      AFRAME.registerComponent('pendulum-lab', {
        schema: {
          length: {type: 'number', default: 2.0},
          mass: {type: 'number', default: 1.0},
          duration: {type: 'number', default: 10.0},
          gravity: {type: 'number', default: 9.81}
        },

        init: function () {
          this.isRunning = false;
          this.elapsedTime = 0;
          this.thetaMax = 0.5; // Swing angle in radians (approx 30 degrees)
          
          // UI References
          this.lengthText = document.querySelector('#l-val');
          this.massText = document.querySelector('#m-val');
          this.timeText = document.querySelector('#t-val');
          this.formulaText = document.querySelector('#formula-display');
          
          this.updateCalculations();
        },

        updateCalculations: function () {
          // T = 2 * PI * sqrt(L/g)
          this.period = 2 * Math.PI * Math.sqrt(this.data.length / this.data.gravity);
          this.totalOscillations = this.data.duration / this.period;
          
          // Update 3D visual length
          const visualString = document.querySelector('#string');
          const visualBob = document.querySelector('#bob');
          visualString.setAttribute('height', this.data.length);
          visualString.setAttribute('position', `0 ${-this.data.length / 2} 0`);
          visualBob.setAttribute('position', `0 ${-this.data.length} 0`);
          visualBob.setAttribute('radius', 0.05 + (this.data.mass * 0.05));

          // Update UI Text
          this.lengthText.setAttribute('value', this.data.length.toFixed(1) + 'm');
          this.massText.setAttribute('value', this.data.mass.toFixed(1) + 'kg');
          this.timeText.setAttribute('value', this.data.duration.toFixed(0) + 's');
          
          this.formulaText.setAttribute('value', 
            `FORMULA:\nT = 2*PI*sqrt(L/g)\n\n` +
            `Period (T): ${this.period.toFixed(2)}s\n` +
            `Total Oscillations:\n${this.totalOscillations.toFixed(2)}`
          );
        },

        tick: function (time, timeDelta) {
          if (!this.isRunning) return;

          const deltaSeconds = timeDelta / 1000;
          this.elapsedTime += deltaSeconds;

          if (this.elapsedTime >= this.data.duration) {
            this.isRunning = false;
            this.elapsedTime = 0;
            this.el.setAttribute('rotation', '0 0 0');
            return;
          }

          // Simple Harmonic Motion formula: theta(t) = thetaMax * cos(2*PI*t / T)
          const angle = this.thetaMax * Math.cos((2 * Math.PI * this.elapsedTime) / this.period);
          this.el.setAttribute('rotation', `0 0 ${angle * (180 / Math.PI)}`);
        },

        startExp: function () {
          this.elapsedTime = 0;
          this.isRunning = true;
        },

        adjust: function(type, amt) {
          if (type === 'l') this.data.length = Math.max(0.5, this.data.length + amt);
          if (type === 'm') this.data.mass = Math.max(0.2, this.data.mass + amt);
          if (type === 't') this.data.duration = Math.max(1, this.data.duration + amt);
          this.updateCalculations();
        }
      });

      // Button Click Handler
      AFRAME.registerComponent('ui-btn', {
        schema: { type: {type: 'string'} },
        init: function () {
          this.el.addEventListener('click', () => {
            const lab = document.querySelector('#pendulum-pivot').components['pendulum-lab'];
            if (this.data.type === 'start') lab.startExp();
            else {
              const parts = this.data.type.split('_');
              lab.adjust(parts[0], parseFloat(parts[1]));
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #222" cursor="rayOrigin: mouse">
      
      <!-- Quest 3 Controllers -->
      <a-entity laser-controls="hand: right"></a-entity>
      <a-entity laser-controls="hand: left"></a-entity>

      <!-- Experiment Environment -->
      <a-entity id="lab-setup" position="0 0 -2">
        
        <!-- The Support Beam -->
        <a-box position="0 3 0" width="3" height="0.1" depth="0.1" color="#888"></a-box>

        <!-- The Pendulum -->
        <a-entity id="pendulum-pivot" position="0 3 0" pendulum-lab>
          <a-cylinder id="string" radius="0.01" color="#AAA"></a-cylinder>
          <a-sphere id="bob" color="#EF2D5E"></a-sphere>
        </a-entity>

        <!-- CONTROL PANEL (Left) -->
        <a-entity position="-2 1.5 0">
          <a-text value="CONTROLS" position="0 1 0" align="center" width="4"></a-text>
          
          <!-- Length Controls -->
          <a-text value="Length" position="-0.8 0.6 0" width="3"></a-text>
          <a-box ui-btn="type: l_0.5" position="0 0.6 0" width="0.2" height="0.2" depth="0.1" color="green"></a-box>
          <a-box ui-btn="type: l_-0.5" position="0.3 0.6 0" width="0.2" height="0.2" depth="0.1" color="red"></a-box>
          <a-text id="l-val" value="2.0m" position="0.6 0.6 0" width="3"></a-text>

          <!-- Mass Controls -->
          <a-text value="Mass" position="-0.8 0.2 0" width="3"></a-text>
          <a-box ui-btn="type: m_0.2" position="0 0.2 0" width="0.2" height="0.2" depth="0.1" color="green"></a-box>
          <a-box ui-btn="type: m_-0.2" position="0.3 0.2 0" width="0.2" height="0.2" depth="0.1" color="red"></a-box>
          <a-text id="m-val" value="1.0kg" position="0.6 0.2 0" width="3"></a-text>

          <!-- Time Controls -->
          <a-text value="Time" position="-0.8 -0.2 0" width="3"></a-text>
          <a-box ui-btn="type: t_5" position="0 -0.2 0" width="0.2" height="0.2" depth="0.1" color="green"></a-box>
          <a-box ui-btn="type: t_-5" position="0.3 -0.2 0" width="0.2" height="0.2" depth="0.1" color="red"></a-box>
          <a-text id="t-val" value="10s" position="0.6 -0.2 0" width="3"></a-text>

          <!-- Start Button -->
          <a-box ui-btn="type: start" position="0 -0.7 0" width="1" height="0.3" depth="0.1" color="blue">
            <a-text value="START" align="center" position="0 0 0.06" width="4"></a-text>
          </a-box>
        </a-entity>

        <!-- DATA PANEL (Right) -->
        <a-entity position="2 1.5 0">
          <a-plane color="#333" width="2" height="2" position="0 0.2 -0.01"></a-plane>
          <a-text id="formula-display" value="Loading..." position="0 0.2 0.05" align="center" width="3.5"></a-text>
        </a-entity>

      </a-entity>

      <!-- Floor -->
      <a-grid static-body></a-grid>
      <a-camera position="0 1.6 1"></a-camera>

    </a-scene>
  </body>
</html>
