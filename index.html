<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>VR Science Lab - Interactive</title>
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Physics System -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <!-- Super Hands for Interaction -->
    <script src="https://unpkg.com/super-hands@^3.0.3/dist/super-hands.min.js"></script>
    <!-- Extras for hand controls and physics helpers -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.misc.min.js"></script>

    <script>
      // Logic for the chemistry experiment
      AFRAME.registerComponent('reaction', {
        init: function () {
          this.el.addEventListener('collide', (e) => {
            const collidedObj = e.detail.body.el;
            if (collidedObj && collidedObj.id === 'beaker-sensor') {
              const liquid = document.querySelector('#liquid');
              const newColor = this.el.getAttribute('material').color;
              liquid.setAttribute('material', 'color', newColor);
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- physics="debug: true" will show wireframes so you can see if the hand is hitting the ball -->
    <a-scene physics="debug: false; gravity: -9.8">
      
      <a-assets>
        <!-- Mixin for grabbable objects to save space -->
        <a-mixin id="ball" 
                 hoverable grabbable draggable droppable
                 shadow
                 dynamic-body="linearDamping: 0.5; angularDamping: 0.5"></a-mixin>
      </a-assets>

      <a-sky color="#111"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="20" height="20" color="#222"></a-plane>

      <!-- Lab Table (Static body means it won't move) -->
      <a-box id="table" static-body 
             position="0 0.6 -0.8" 
             width="2" height="0.1" depth="1" 
             color="#444"></a-box>

      <!-- Beaker Setup -->
      <a-entity position="0 0.65 -0.8">
        <a-cylinder radius="0.15" height="0.3" material="opacity: 0.3; transparent: true; color: #fff"></a-cylinder>
        <!-- The sensor is what triggers the color change -->
        <a-cylinder id="beaker-sensor" static-body radius="0.15" height="0.1" visible="false"></a-cylinder>
        <a-cylinder id="liquid" radius="0.14" height="0.1" position="0 -0.05 0" color="#fff"></a-cylinder>
      </a-entity>

      <!-- Experiment Items (The Chemicals) -->
      <a-sphere mixin="ball" reaction position="-0.4 1.2 -0.8" radius="0.1" color="red" class="grabbable"></a-sphere>
      <a-sphere mixin="ball" reaction position="0.4 1.2 -0.8" radius="0.1" color="blue" class="grabbable"></a-sphere>
      <a-sphere mixin="ball" reaction position="0 1.2 -0.6" radius="0.1" color="green" class="grabbable"></a-sphere>

      <!-- Player & Controllers -->
      <a-entity id="rig">
        <a-camera position="0 1.6 0.5" look-controls></a-camera>
        
        <!-- Left Controller -->
        <a-entity sphere-collider="objects: .grabbable" 
                  super-hands 
                  hand-controls="hand: left; handModelStyle: lowPoly; color: #ffcccc"></a-entity>
        
        <!-- Right Controller -->
        <a-entity sphere-collider="objects: .grabbable" 
                  super-hands 
                  hand-controls="hand: right; handModelStyle: lowPoly; color: #ffcccc"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
