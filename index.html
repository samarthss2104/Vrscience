<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quest 3 Science Lab</title>
    <!-- Core A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- Physics -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <!-- Super Hands (The interaction "Brain") -->
    <script src="https://unpkg.com/super-hands@^3.0.3/dist/super-hands.min.js"></script>
    <!-- Extras for hand models -->
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.0.0/dist/aframe-extras.misc.min.js"></script>

    <script>
      // The Chemistry Logic
      AFRAME.registerComponent('chemical-logic', {
        init: function () {
          this.el.addEventListener('collide', (e) => {
            const target = e.detail.body.el;
            if (target && target.id === 'beaker-base') {
              const liquid = document.querySelector('#liquid-visual');
              const color = this.el.getAttribute('material').color;
              liquid.setAttribute('material', 'color', color);
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <!-- We added "raycaster" to the scene so it knows how to "click" from far away -->
    <a-scene physics="debug: false; gravity: -9.8">
      
      <!-- Sky & Ground -->
      <a-sky color="#1a1a1a"></a-sky>
      <a-plane static-body rotation="-90 0 0" width="50" height="50" color="#333"></a-plane>

      <!-- The Table -->
      <a-box id="table" static-body position="0 0.7 -0.8" width="1.5" height="0.1" depth="0.8" color="#444"></a-box>

      <!-- The Beaker (Static) -->
      <a-entity position="0 0.8 -0.8">
        <a-cylinder radius="0.15" height="0.3" material="opacity: 0.3; transparent: true; color: white"></a-cylinder>
        <!-- The invisible physics sensor -->
        <a-cylinder id="beaker-base" static-body radius="0.15" height="0.05" position="0 -0.1 0" visible="false"></a-cylinder>
        <!-- The visual liquid -->
        <a-cylinder id="liquid-visual" radius="0.14" height="0.1" position="0 -0.1 0" color="#fff"></a-cylinder>
      </a-entity>

      <!-- Interactive Chemicals (Grabbable) -->
      <!-- Red -->
      <a-sphere class="clickable" chemical-logic
                dynamic-body="shape: sphere; mass: 2" 
                hoverable grabbable draggable droppable
                position="-0.3 1.2 -0.8" radius="0.1" color="red"></a-sphere>
      <!-- Blue -->
      <a-sphere class="clickable" chemical-logic
                dynamic-body="shape: sphere; mass: 2" 
                hoverable grabbable draggable droppable
                position="0.3 1.2 -0.8" radius="0.1" color="blue"></a-sphere>

      <!-- Meta Quest 3 Controllers Setup -->
      <a-entity id="rig">
        <a-camera position="0 1.6 0.5" look-controls></a-camera>

        <!-- Left Hand: Pointer + Touch -->
        <a-entity id="leftHand"
                  super-hands="colliderEvent: raycaster-intersection; 
                               colliderEventProperty: el; 
                               colliderEndEvent: raycaster-intersection-cleared; 
                               colliderEndEventProperty: el"
                  oculus-touch-controls="hand: left"
                  sphere-collider="objects: .clickable"
                  raycaster="objects: .clickable; showLine: true; far: 10"
                  hand-controls="hand: left; handModelStyle: lowPoly"></a-entity>

        <!-- Right Hand: Pointer + Touch -->
        <a-entity id="rightHand"
                  super-hands="colliderEvent: raycaster-intersection; 
                               colliderEventProperty: el; 
                               colliderEndEvent: raycaster-intersection-cleared; 
                               colliderEndEventProperty: el"
                  oculus-touch-controls="hand: right"
                  sphere-collider="objects: .clickable"
                  raycaster="objects: .clickable; showLine: true; far: 10"
                  hand-controls="hand: right; handModelStyle: lowPoly"></a-entity>
      </a-entity>

    </a-scene>
  </body>
</html>
